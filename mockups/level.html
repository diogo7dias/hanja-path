<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Hanja NOTE — Learn Korean through hanja with structured lessons, quizzes, and progress tracking.">
<meta property="og:title" content="한자 NOTE">
<meta property="og:type" content="website">
<title>한자 NOTE — Levels</title>
<style>
:root{--bg:#121212;--ink:#f2efe6;--dim:rgba(242,239,230,.55);--faint:rgba(242,239,230,.35);--line:rgba(242,239,230,.22);--linestrong:rgba(242,239,230,.6);--serif:'Georgia','Times New Roman',serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Helvetica Neue',Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:28px 32px 80px}
.top{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:14px}
.brand{font-size:19px;letter-spacing:.3em;color:#fff}
.brand a{color:#fff;text-decoration:none}
.brand .han{font-family:var(--serif);letter-spacing:.06em}
.vol{font-size:11px;letter-spacing:.28em;color:var(--dim)}
.hr{border:0;border-top:1px solid var(--line)}
nav{display:flex;gap:26px;justify-content:flex-end;padding:14px 0;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
nav a{color:var(--dim);text-decoration:none}
nav a:hover{color:#fff}
nav a.on{color:#fff}
.hero{padding:50px 0 30px}
.home-title{font-family:var(--serif);font-size:46px;line-height:1.05;margin:0;letter-spacing:.02em;font-weight:400}
.home-title .hangul small{display:block;font-size:15px;letter-spacing:.42em;color:var(--dim);font-family:'Helvetica Neue',Arial,sans-serif;font-weight:400;margin-top:14px}
.meta-line{margin-top:22px;font-size:13px;color:var(--dim);letter-spacing:.06em}
.meta-line b{color:#fff;font-weight:500}
.search{width:100%;background:transparent;border:0;border-bottom:1px solid var(--linestrong);color:#fff;font-size:20px;padding:14px 2px;outline:0;letter-spacing:.04em;font-family:var(--serif)}
.search::placeholder{color:var(--faint);font-family:'Helvetica Neue',Arial,sans-serif;font-size:14px;letter-spacing:.1em}
/* pager */
.pager{display:flex;justify-content:space-between;align-items:center;margin:26px 0 6px;font-size:12px;letter-spacing:.2em;color:var(--faint)}
.pager button{background:transparent;border:1px solid var(--line);color:var(--dim);padding:9px 16px;font-size:11px;letter-spacing:.2em;cursor:pointer;text-transform:uppercase}
.pager button:hover{color:#fff;border-color:var(--linestrong)}
.pager button:disabled{opacity:.25;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
.card{border:1px solid var(--line);padding:20px 20px 16px;text-decoration:none;color:var(--ink);display:block;transition:border-color .2s}
.card:hover{border-color:var(--linestrong)}
.card .glyph{font-family:var(--serif);font-size:46px;line-height:1}
.card .reading{font-size:15px;margin-top:10px}
.card .meaning{font-size:11px;letter-spacing:.14em;color:var(--dim);margin-top:2px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .go{margin-top:12px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.empty{padding:60px 0;color:var(--dim);font-size:14px;letter-spacing:.06em;text-align:center}
.nores{display:none}
.pills{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.pill{border:1px solid var(--line);color:var(--dim);padding:8px 16px;text-decoration:none;font-size:12px;letter-spacing:.16em}
.pill.on{color:#fff;border-color:#fff}
.pill:hover{color:#fff;border-color:var(--linestrong)}
.sec{padding:30px 0 6px;display:flex;align-items:center;gap:16px}
.sec .tag{font-size:11px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.sec .rule{flex:1;border-top:1px solid var(--linestrong)}
.foot{margin-top:60px;border-top:1px solid var(--line);padding-top:18px;font-size:11px;letter-spacing:.2em;color:var(--faint);display:flex;justify-content:space-between}
</style>
<script src="hanja-data.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="brand"><a href="index.html"><span class="han">한자</span> NOTE</a></div>
      <div class="vol" id="vol">HANJA CURRICULUM</div>
    </div>
    <div class="hr"></div>
    <nav><a href="index.html">Home</a><a href="levels.html" class="on">Levels</a><a href="lessons.html?l=0">Lessons</a><a href="reading.html?r=가">Readings</a><a href="quiz.html">Quiz</a></nav>
  </header>

  <section class="hero">
    <h1 class="home-title" id="title">…<br><span class="hangul"><small id="subtitle">…</small></span></h1>
    <div class="meta-line" id="metaLine">…</div>
  </section>

  <div class="pills" id="pills"></div>

  <div class="sec"><span class="tag">Browse</span><span class="rule"></span></div>
  <input class="search" id="search" type="text" placeholder="SEARCH 한자 · reading · meaning" autocomplete="off">

  <div class="pager">
    <button id="prev">← Prev</button>
    <span id="pageinfo"></span>
    <button id="next">Next →</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="nores empty" id="nores">No hanja match that search.</div>

  <footer class="foot"><span>한자 NOTE</span><span id="footcount">— · <a href="https://ko-fi.com/d7d7m" target="_blank" rel="noopener">Support on Ko-fi ↗</a></span></footer>
</div>
<script>
(function(){
  var qs=new URLSearchParams(location.search);
  var lv=parseInt(qs.get('l')); if(isNaN(lv)) lv=0;
  var PAGE=24, page=0, q='';
  var D=window.HANJA;
  var meta=D.levels[lv];
  var LEVELMETA=[['초급','Beginner','山','The world in pictures'],['중급','Intermediate','心','Words &amp; ideas'],['고급','Advanced','德','Virtue &amp; abstraction']];
  var lm=LEVELMETA[lv];
  function el(id){return document.getElementById(id)}
  el('title').innerHTML=lm[2]+' '+lm[0]+'<br><span class="hangul"><small>'+lm[1]+' · '+lm[3]+'</small></span>';
  el('vol').textContent='LEVEL '+(lv+1)+' · '+meta.ko.toUpperCase();
  el('footcount').textContent=meta.ko+' · '+meta.n+' hanja of '+D.total;
  // pills row
  var pills=el('pills');
  D.levels.forEach(function(m,i){
    var a=document.createElement('a');
    a.className='pill'+(i===lv?' on':'');
    a.href='level.html?l='+i;
    a.textContent=m.ko+' ('+m.n+')';
    pills.appendChild(a);
  });

  function matches(h,s){
    if(!s) return true;
    s=s.toLowerCase();
    if((h.c.indexOf(s)>=0)||(h.r.indexOf(s)>=0)||(h.h.indexOf(s)>=0)||((h.eng||'')+' '+(h.h)).toLowerCase().indexOf(s)>=0) return true;
    // match the Korean words this character appears in (e.g. 가족 -> 家/家族)
    var ws=h.words||[];
    for(var i=0;i<ws.length;i++){
      if(((ws[i].ko||'').toLowerCase().indexOf(s)>=0)||((ws[i].hj||'').indexOf(s)>=0)) return true;
    }
    return false;
  }
  function list(){
    return D.hanja.filter(function(h){ return h.lv===lv && matches(h,q); });
  }
  function render(){
    var arr=list();
    var pages=Math.max(1,Math.ceil(arr.length/PAGE));
    if(page>=pages) page=pages-1;
    var start=page*PAGE, slice=arr.slice(start,start+PAGE);
    var grid=el('grid'); grid.innerHTML='';
    el('nores').style.display = arr.length? 'none':'';
    el('metaLine').innerHTML='<b>'+arr.length+'</b> hanja shown'+(q?' for “'+q+'” ':' in this level');
    slice.forEach(function(h){
      var card=document.createElement('a');
      card.className='card'; card.href='lesson.html?l='+lv+'&lesson='+(h.lesson||0);
      card.innerHTML='<div class="glyph">'+h.c+'</div>'+
        '<div class="reading">'+h.h+' <span style="color:var(--faint)">'+h.r+'</span></div>'+
        '<div class="meaning">'+(h.eng||h.h)+'</div>'+
        '<div class="go">Study →</div>';
      grid.appendChild(card);
    });
    el('pageinfo').textContent=(arr.length? (start+1)+'–'+(start+slice.length) : 0)+' / '+arr.length;
    el('prev').disabled = page<=0;
    el('next').disabled = page>=pages-1;
  }
  el('prev').onclick=function(){ if(page>0){page--;render();} };
  el('next').onclick=function(){ page++; render(); };
  el('search').addEventListener('input',function(){ q=el('search').value.trim(); page=0; render(); });
  render();
})();
</script>
</body>
</html>
